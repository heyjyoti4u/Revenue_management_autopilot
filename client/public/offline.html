<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d22" />
    <title>SignalStay — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #080d22; color: #f7f5f0; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 70% 30%, rgba(139,92,246,.2), transparent 32%), #080d22; }
      main { width: min(520px, calc(100% - 48px)); padding: 40px; border: 1px solid rgba(196,181,253,.25); background: rgba(16,22,51,.78); box-shadow: 14px 14px 0 rgba(139,92,246,.12); }
      img { width: 54px; height: 54px; margin-bottom: 34px; }
      p { color: rgba(247,245,240,.62); line-height: 1.6; }
      a { display: inline-block; margin-top: 14px; padding: 13px 18px; border-radius: 999px; background: #8b5cf6; color: #fff; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="SignalStay" />
      <h1>Signal, temporarily offline.</h1>
      <p>The operating view is cached, but this page needs a connection to refresh the latest revenue signals.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
